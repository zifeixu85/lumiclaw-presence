name: M3 SDD-003 governed execution gates

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  static:
    name: M3 SDD-003 / static
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: M3 contracts
        run: npm test -- --run packages/domain/src/action-grant.test.ts apps/action-operator/src/outbox-consumer.test.ts apps/api/src/action-grant-routes.test.ts apps/api/src/receipt-routes.test.ts

  fresh-postgres:
    name: M3 SDD-003 / fresh PostgreSQL adversarial and cross-process
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - name: Fresh PG, five adversarial states, roles and cross-process
        run: npm run verify:m3-fresh-postgres
      - name: Upload M3 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-sdd003-fresh-postgres-evidence
          path: .evidence/sdd-003/
          if-no-files-found: error
          retention-days: 7

  evidence-integrity:
    name: M3 SDD-003 / evidence integrity
    needs: [static, fresh-postgres]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - name: Download fresh PostgreSQL evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: m3-sdd003-fresh-postgres-evidence
          path: .evidence/sdd-003
      - name: Verify exact M3 evidence fields
        run: node scripts/verify-m3-evidence-integrity.mjs

  aggregate:
    name: M3 SDD-003 / exact aggregate gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.16.0
          cache: npm
      - name: Verify exact npm version
        run: test "$(npm --version)" = "11.13.0"
      - name: Reproducible install
        run: npm ci
      - name: Run exact M3 SDD-003 aggregate gate
        run: npm run verify:m3-sdd003
      - name: Upload aggregate and underlying public-safe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-sdd003-aggregate-evidence
          path: |
            .evidence/sdd-003/aggregate.json
            .evidence/sdd-003/fresh-postgres.json
            .evidence/sdd-003/fresh-postgres-transcript.log
            .evidence/sdd-003/postgres-repository-vitest.json
            .evidence/sdd-003/named-postgres-tests.json
            .evidence/m3-01/action-grant-integration.json
          if-no-files-found: warn
          retention-days: 7
